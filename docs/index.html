<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>南开小友</title>
  <link rel="stylesheet" href="vendor/vue.css">
  <style>
    /* 南开紫（青莲紫）——南开校色，用于「六大主力板块」等标识 */
    .nk-purple, strong.nk-purple, .sidebar strong.nk-purple, .markdown-section strong.nk-purple { color: #7E0C6E !important; }
    /* 左侧导读条最上端的站名「南开小友」——字号不动，加粗 + 南开紫 */
    .sidebar > h1.app-name, .sidebar > h1.app-name > a.app-name-link { font-weight: 700 !important; color: #7E0C6E !important; }
    /* 左侧导读条「文件夹」层级强化：子级缩进＋竖向导引线；可点击的文件夹标题＝南开紫加粗 */
    .sidebar ul li ul { margin-left: 6px !important; padding-left: 10px !important; border-left: 1px solid rgba(126,12,110,.18); }
    .sidebar ul li:has(> ul) > a { font-weight: 600; color: #7E0C6E; }
    .sidebar ul li:has(> ul) > a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '南开小友',
      loadSidebar: true,
      auto2top: true,
      homepage: 'README.md'
    }
  </script>
  <script>
    /**
     * 构建版本号（BUILD）——每发布一次内容就改一个值。
     * 作用：docsify 是用 XHR 取 .md 文件的，托管层会对同一个地址做启发式缓存，
     *       导致更新后仍显示旧内容。给每次请求带上 BUILD，等于每次发布都换一批
     *       全新的地址，缓存自然失效。（托管层会忽略这个参数，不影响取文件）
     */
    (function () {
      var BUILD = 'v2.5.29';
      var rawOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        var args = Array.prototype.slice.call(arguments);
        if (typeof url === 'string' && /\.md(\?|#|$)/.test(url)) {
          args[1] = url + (url.indexOf('?') > -1 ? '&' : '?') + 'b=' + BUILD;
        }
        return rawOpen.apply(this, args);
      };
    })();
  </script>
  <script src="vendor/docsify.min.js"></script>
</body>
</html>
